# Default (0.4 = 40% of what RabbitMQ thinks is "available" memory) trips
# the memory alarm too easily on a dev machine running the whole stack
# (Postgres + RabbitMQ + MinIO + the app + a browser) side by side — once
# tripped, RabbitMQ blocks publishers (though it keeps consuming), which
# is why /actuator/health can report the `rabbit` component DOWN even
# though nothing is actually broken. Raised so local dev has headroom.
vm_memory_high_watermark.relative = 0.7
