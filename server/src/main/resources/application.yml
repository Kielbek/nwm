spring:
  application:
    name: nwm-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nwm}
    username: ${DB_USERNAME:nwm}
    password: ${DB_PASSWORD:nwm}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:nwm}
    password: ${RABBITMQ_PASSWORD:nwm}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_DEV_ONLY_INSECURE_SECRET_MIN_32_BYTES_LONG}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    tts-request-queue: tts.generate.requests
    tts-result-queue: tts.generate.results
    tts-exchange: tts.exchange
    tts-dlq: tts.generate.dlq
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:nwm-audio}
    access-key: ${S3_ACCESS_KEY:nwm}
    secret-key: ${S3_SECRET_KEY:nwm12345}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    presign-ttl-minutes: ${S3_PRESIGN_TTL_MIN:15}
  rate-limit:
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    auth-refill-per-minute: ${RATE_LIMIT_AUTH_REFILL:10}

logging:
  level:
    root: INFO
    app.nwm.server: ${LOG_LEVEL:INFO}
