<div class="app-shell">
  @if (isMobile() && sidebarOpen()) {
    <div class="app-shell__backdrop" (click)="closeSidebar()"></div>
  }
  <app-sidebar [open]="sidebarOpen()" [overlay]="isMobile()" (closeRequested)="closeSidebar()" />
  <div class="app-shell__main">
    <app-header (toggleSidebar)="toggleSidebar()" />
    <router-outlet></router-outlet>
  </div>
</div>
