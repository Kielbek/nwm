<app-auth-layout [tagline]="translate.dict().authLayout.taglineLogin">
  <form class="auth-form" (ngSubmit)="submit()">
    <h1 class="auth-form__title">{{ translate.dict().loginPage.title }}</h1>
    <p class="auth-form__subtitle">{{ translate.dict().loginPage.subtitle }}</p>

    <button type="button" class="auth-form__btn" (click)="signInWithGoogle()">
      <app-icon name="google" [size]="17" />
      {{ translate.dict().loginPage.googleButton }}
    </button>

    <div class="auth-form__divider">{{ translate.dict().loginPage.divider }}</div>

    <label class="auth-form__field">
      <span>{{ translate.dict().loginPage.emailLabel }}</span>
      <input
        type="email"
        class="auth-form__input"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        autocomplete="email"
        [placeholder]="translate.dict().loginPage.emailPlaceholder"
      />
    </label>

    <label class="auth-form__field">
      <div class="auth-form__field-head">
        <span>{{ translate.dict().loginPage.passwordLabel }}</span>
        <a class="auth-form__forgot-link" routerLink="/forgot-password">
          {{ translate.dict().loginPage.forgotPassword }}
        </a>
      </div>
      <div class="auth-form__input-wrap">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          autocomplete="current-password"
          [placeholder]="translate.dict().loginPage.passwordPlaceholder"
        />
        <button
          type="button"
          class="auth-form__input-toggle"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="translate.dict().loginPage.togglePassword"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16" />
        </button>
      </div>
    </label>

    @if (errorMessage(); as error) {
      <p class="auth-form__error">
        <app-icon name="close" [size]="13" />
        {{ error }}
      </p>
    }

    <button type="submit" class="auth-form__btn auth-form__btn--primary" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span class="auth-form__spinner"></span>
        {{ translate.dict().loginPage.submitting }}
      } @else {
        {{ translate.dict().loginPage.submit }}
      }
    </button>

    <p class="auth-form__footer">
      {{ translate.dict().loginPage.noAccount }}
      <a routerLink="/register">{{ translate.dict().loginPage.registerLink }}</a>
    </p>
  </form>
</app-auth-layout>
