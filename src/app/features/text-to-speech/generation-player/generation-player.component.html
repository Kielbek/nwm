<div class="player">
  <div class="player__head">
    <p class="player__title">{{ entry.text.length > 70 ? (entry.text.slice(0, 70) + '…') : entry.text }}</p>
    <div class="player__meta">
      <app-icon name="voices" [size]="12" />
      <span>{{ entry.voiceName }}</span>
      @if (entry.voiceDescription) {
        <span class="player__meta-dot">·</span>
        <span>{{ entry.voiceDescription }}</span>
      }
      <span class="player__meta-dot">·</span>
      <span>{{ relativeTime() }}</span>
    </div>
  </div>

  <div class="player__controls">
    <div class="player__transport">
      <button
        type="button"
        class="player__skip"
        [attr.aria-label]="translate.dict().player.skipBack"
        (click)="skip(-10)"
      >
        <app-icon name="skip-back" [size]="18" />
        <span class="player__skip-label">10</span>
      </button>

      <button
        type="button"
        class="player__play"
        [attr.aria-label]="isPlaying() ? translate.dict().player.pause : translate.dict().player.play"
        (click)="togglePlay()"
      >
        <app-icon [name]="isPlaying() ? 'pause' : 'play'" [size]="18" />
      </button>

      <button
        type="button"
        class="player__skip"
        [attr.aria-label]="translate.dict().player.skipForward"
        (click)="skip(10)"
      >
        <app-icon name="skip-forward" [size]="18" />
        <span class="player__skip-label">10</span>
      </button>
    </div>

    <div class="player__feedback">
      <button
        type="button"
        class="player__icon-btn"
        [class.player__icon-btn--active]="entry.feedback === 'up'"
        [attr.aria-label]="translate.dict().player.thumbUp"
        (click)="setFeedback('up')"
      >
        <app-icon name="thumb-up" [size]="15" />
      </button>
      <button
        type="button"
        class="player__icon-btn"
        [class.player__icon-btn--active]="entry.feedback === 'down'"
        [attr.aria-label]="translate.dict().player.thumbDown"
        (click)="setFeedback('down')"
      >
        <app-icon name="thumb-down" [size]="15" />
      </button>
    </div>

    <div class="player__actions">
      <button type="button" class="player__action-btn" (click)="share()">
        <app-icon name="share" [size]="14" />
        {{ justCopied() ? translate.dict().player.shareCopied : translate.dict().player.share }}
      </button>
      <button
        type="button"
        class="player__icon-btn"
        [attr.aria-label]="translate.dict().player.download"
        (click)="download()"
      >
        <app-icon name="download" [size]="15" />
      </button>
    </div>
  </div>

  <div class="player__scrubber">
    <span class="player__time">{{ formatTime(elapsed()) }}</span>
    <div class="player__track">
      <div
        class="player__track-fill"
        [style.width.%]="duration() ? (elapsed() / duration()) * 100 : 0"
      ></div>
    </div>
    <span class="player__time">{{ formatTime(duration()) }}</span>
  </div>
</div>
