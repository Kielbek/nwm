<div class="app-shell" [style.--sidebar-width.px]="sidebarWidthPx()">
  @if (isMobile() && (sidebarOpen() || askOpen())) {
    <div class="app-shell__backdrop" (click)="closeSidebar(); closeAsk()"></div>
  }
  <app-sidebar
    [open]="sidebarOpen()"
    [overlay]="isMobile()"
    [framed]="askOpen() && !isMobile()"
    (closeRequested)="closeSidebar()"
  />
  <div
    class="app-shell__main"
    [class.app-shell__main--framed]="askOpen() && !isMobile()"
    [class.app-shell__main--with-player]="history.activeEntry()"
    [class.app-shell__main--player-collapsed]="playerCollapsed()"
  >
    <app-header
      [askOpen]="askOpen()"
      (toggleSidebar)="toggleSidebar()"
      (toggleAsk)="toggleAsk()"
    />
    <router-outlet></router-outlet>
  </div>
  @if (history.activeEntry(); as entry) {
    <app-generation-player
      [entry]="entry"
      (closeRequested)="history.activeEntryId.set(null)"
      (collapsedChange)="playerCollapsed.set($event)"
    />
  }
  <app-ask-panel [open]="askOpen()" [overlay]="isMobile()" (closeRequested)="closeAsk()" />
  <app-command-palette />
  <app-invite-modal />
  <app-upgrade-modal />
  <app-history-detail-modal />
</div>
