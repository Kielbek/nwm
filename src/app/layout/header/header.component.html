<header class="header">
  <div class="header__left">
    <button
      type="button"
      class="header__icon-btn"
      [attr.aria-label]="translate.dict().header.toggleSidebar"
      (click)="toggleSidebar.emit()"
    >
      <app-icon name="panel" [size]="18" />
    </button>
    <h1 class="header__title">{{ translate.dict().header.pageTitle }}</h1>
  </div>

  <div class="header__search">
    <app-icon name="search" [size]="16" />
    <span class="header__search-text">{{ translate.dict().header.searchPlaceholder }}</span>
    <kbd>⌘K</kbd>
  </div>

  <div class="header__right">
    <a
      class="header__link header__link--secondary"
      routerLink="/feedback"
      routerLinkActive="header__link--active-route"
    >
      {{ translate.dict().header.feedback }}
    </a>
    <a
      class="header__link header__link--secondary"
      routerLink="/docs"
      routerLinkActive="header__link--active-route"
    >
      {{ translate.dict().header.docs }}
    </a>
    <button
      type="button"
      class="header__link header__link--primary"
      [class.header__link--active]="askOpen"
      (click)="toggleAsk.emit()"
    >
      <app-icon name="sparkle" [size]="14" />
      <span>{{ translate.dict().header.ask }}</span>
    </button>

    <app-dropdown #langDropdown align="end">
      <button
        type="button"
        class="header__icon-btn header__icon-btn--wide"
        dropdownTrigger
        [attr.aria-label]="translate.dict().header.language"
      >
        <app-icon name="globe" [size]="17" />
        <span class="header__icon-btn-label">{{ translate.lang().toUpperCase() }}</span>
      </button>
      <div dropdownPanel class="header__menu">
        <button type="button" class="header__menu-item" (click)="selectLang('pl', langDropdown)">
          <span class="header__menu-item-label">Polski</span>
          @if (translate.lang() === 'pl') {
            <app-icon name="check" [size]="15" class="header__menu-check" />
          }
        </button>
        <button type="button" class="header__menu-item" (click)="selectLang('en', langDropdown)">
          <span class="header__menu-item-label">English</span>
          @if (translate.lang() === 'en') {
            <app-icon name="check" [size]="15" class="header__menu-check" />
          }
        </button>
      </div>
    </app-dropdown>

    <app-dropdown #themeDropdown align="end">
      <button
        type="button"
        class="header__icon-btn"
        dropdownTrigger
        [attr.aria-label]="translate.dict().header.theme"
      >
        <app-icon [name]="themeIcon[theme.mode()]" [size]="18" />
      </button>
      <div dropdownPanel class="header__menu">
        <button type="button" class="header__menu-item" (click)="selectTheme('light', themeDropdown)">
          <app-icon name="sun" [size]="15" />
          <span class="header__menu-item-label">{{ translate.dict().header.themeLight }}</span>
          @if (theme.mode() === 'light') {
            <app-icon name="check" [size]="15" class="header__menu-check" />
          }
        </button>
        <button type="button" class="header__menu-item" (click)="selectTheme('dark', themeDropdown)">
          <app-icon name="moon" [size]="15" />
          <span class="header__menu-item-label">{{ translate.dict().header.themeDark }}</span>
          @if (theme.mode() === 'dark') {
            <app-icon name="check" [size]="15" class="header__menu-check" />
          }
        </button>
        <button type="button" class="header__menu-item" (click)="selectTheme('system', themeDropdown)">
          <app-icon name="monitor" [size]="15" />
          <span class="header__menu-item-label">{{ translate.dict().header.themeSystem }}</span>
          @if (theme.mode() === 'system') {
            <app-icon name="check" [size]="15" class="header__menu-check" />
          }
        </button>
      </div>
    </app-dropdown>

    <button type="button" class="header__icon-btn header__icon-btn--secondary">
      <app-icon name="folder" [size]="18" />
    </button>
    <button type="button" class="header__icon-btn header__icon-btn--dot">
      <app-icon name="bell" [size]="18" />
    </button>
    <div class="header__avatar">M</div>
  </div>
</header>
