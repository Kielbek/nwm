<aside class="sidebar" [class.sidebar--open]="open" [class.sidebar--overlay]="overlay">
  <div class="sidebar__brand">
    <span class="sidebar__brand-mark">
      <app-icon name="text-to-speech" [size]="14" />
    </span>
    <span class="sidebar__brand-name">NWM</span>
    @if (overlay) {
      <button
        type="button"
        class="sidebar__close"
        [attr.aria-label]="translate.dict().sidebar.closeMenu"
        (click)="closeRequested.emit()"
      >
        <app-icon name="close" [size]="16" />
      </button>
    }
  </div>

  <nav class="sidebar__nav">
    <a
      class="sidebar__item"
      routerLink="/"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <app-icon name="text-to-speech" [size]="18" />
      <span>{{ translate.dict().sidebar.nav }}</span>
    </a>
    <a class="sidebar__item" routerLink="/voices" routerLinkActive="sidebar__item--active">
      <app-icon name="voices" [size]="18" />
      <span>{{ translate.dict().sidebar.voices }}</span>
    </a>
  </nav>
</aside>
